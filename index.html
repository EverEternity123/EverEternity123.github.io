<script>
(function () {
  try {
    var saved = localStorage.getItem('ee-blog-theme');
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
  } catch (e) { /* ignore */ }
})();
</script>
<script>
(function () {
  // 站点信息（首页介绍 / 关于页正文 / 页脚落款）是 site.js 读完 data/site.json
  // 才填的，HTML 里那份只是兜底。不先藏起来的话，会先闪一下兜底的旧文案，
  // 再被替换成新的（副标题、标签、页脚都会闪）。放 <head> 里是为了赶在
  // 第一帧之前打上标记；site.js 读完（成功或失败）会摘掉它。
  // JS 被关掉时这几行不会执行，页面照常显示兜底内容，不会开天窗。
  try { document.documentElement.classList.add('ee-site-pending'); } catch (e) { /* ignore */ }
  // 万一 site.js / app.js 没跑起来，3 秒后也强制露出来 ——
  // 宁可看到兜底的旧文案，也不能让这一块一直空着。
  setTimeout(function () {
    try { document.documentElement.classList.remove('ee-site-pending'); } catch (e) { /* ignore */ }
  }, 3000);
})();
</script>
