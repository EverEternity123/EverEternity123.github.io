<!-- 404 页可能出现在任意层级，所以这里一律用绝对路径 -->
<link rel="stylesheet" href="/assets/css/style.css">
<script>
(function () {
  try {
    var saved = localStorage.getItem('ee-blog-theme');
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
  } catch (e) { /* ignore */ }
})();
</script>
<!-- 分享出去的链接是 p/<id>.html（每篇文章一张，head 里写死了 og 标签，
     微信才抓得到正确的预览卡片）。万一那一张还没生成 —— 比如文章是刚在
     手机上发的、本地还没重新发布过 —— 就会落到这个 404 页。
     这里把它转回动态那版，链接不会断，只是预览卡片退回通用样式。 -->
<script>
(function () {
  var m = /^\/p\/([^\/]+)\.html$/.exec(location.pathname);
  if (!m) return;
  try {
    location.replace('/post.html?p=' + encodeURIComponent(decodeURIComponent(m[1])));
  } catch (e) { /* 路径畸形就不转，正常显示 404 */ }
})();
</script>
