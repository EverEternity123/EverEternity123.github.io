<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<!-- ===================================================================
     EE:SEO:START ~ EE:SEO:END 这一整段是「分享预览卡片」用的。
     微信 / QQ 抓预览卡片时只看静态 HTML，不跑 JS —— 而 post.html 只有
     一份，标题只能写通用的。所以 .tools/build-posts.py 会给每篇文章生成
     一张 p/<id>.html，生成时把这一段（含 title）换成那一篇自己的。
     ⚠️ 别把通用的那几行挪到这一段外面：两套 og 同时存在时，
        哪个生效取决于解析器的脾气，必须只有一套。
     =================================================================== -->
<!-- EE:SEO:START -->

<meta property="og:site_name" content="Ever Eternity">
<meta property="og:title" content="我不得不把才华埋葬在昨天">
<meta property="og:description" content="前几天，DeepSeek v4.1 发布了，将小模型能力的高度又向上推进了一个档次。 AI 发展的速度远远超过了所有人的预期。从那个只会咿呀学语地聊天、上下文长度只有几千 token ……">

<meta name="theme-color" content="#faf7f2">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">

<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css?v=ab165549">
<script>
(function () {
  try {
    var saved = localStorage.getItem('ee-blog-theme');
    var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
  } catch (e) { /* ignore */ }
})();
</script>
<script>
(function () {
  // 站点信息（首页介绍 / 关于页正文 / 页脚落款）是 site.js 读完 data/site.json
  // 才填的，HTML 里那份只是兜底。不先藏起来的话，会先闪一下兜底的旧文案，
  // 再被替换成新的（副标题、标签、页脚都会闪）。放 <head> 里是为了赶在
  // 第一帧之前打上标记；site.js 读完（成功或失败）会摘掉它。
  // JS 被关掉时这几行不会执行，页面照常显示兜底内容，不会开天窗。
  try { document.documentElement.classList.add('ee-site-pending'); } catch (e) { /* ignore */ }
  // 万一 site.js / app.js 没跑起来，3 秒后也强制露出来 ——
  // 宁可看到兜底的旧文案，也不能让这一块一直空着。
  setTimeout(function () {
    try { document.documentElement.classList.remove('ee-site-pending'); } catch (e) { /* ignore */ }
  }, 3000);
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="assets/img/brand-64.png" alt="" width="26" height="26"></span>
      <span class="brand-text">Ever Eternity</span>
    </a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="archive.html">全部文章</a>
      <a href="about.html">关于</a>
      <button class="sync-btn" type="button" title="同步最新（强制取一份新页面，绕开缓存）" aria-label="同步最新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11a8.5 8.5 0 1 0-2.2 5.8"/><path d="M20.5 5.5V11H15"/></svg>
      </button>
      <button class="theme-toggle" type="button" aria-label="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap-narrow post-page" id="post-main">
  <!-- 「返回」＝回到你来的那一页（首页 / 全部文章页，连标签筛选和滚动位置一起还回来）。
       没有来路时退回 index.html —— href 就是那层兜底，JS 挂了也能用。
       逻辑在 assets/js/app.js 的 initBack()。
       ⚠️ 这个注释里**一个旧词都不能留**：check-content.js 有一条断言，
          任何 .html 里出现那个已被替换掉的旧导航名就算「旧词泄漏」
          （页面上的入口早改叫「全部文章」了）。 -->
  <a class="back-link" id="back-link" href="index.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回
  </a>

  <header class="post-header">
    <h1 id="post-title">加载中…</h1>
    <p class="lede" id="post-lede"></p>
    <div class="post-meta">
      <time id="post-date"></time>
      <span class="dot"></span>
      <span id="post-author"></span>
      <span id="post-original" hidden><span class="dot"></span><span class="badge-original">原创</span></span>
      <span class="dot"></span>
      <span id="post-time"></span>
    </div>
  </header>

  <!-- 按钮行：AI 摘要与评价（折叠）+ 查看原文 + 分享本文。
       「查看原文」2026-10-04 从正文首行的 [查看原文](url) 挪到这里（数据里是 source 字段）；
       「分享本文」2026-10-04 又在它右边加了一个（正文底部那个 .post-share 仍留着）。
       ⚠️ 这一行里的**分享按钮每篇都要有**，所以 #ai-intro 不能再像以前那样
           「两个按钮都没内容 → 整块 remove()」—— 改成各个按钮自己决定去留，
           容器只负责「有文章就显示」（逻辑在 app.js 的 initAiIntro()）。
       ⚠️ AI 那块 2026-10-06 起**走 Markdown 渲染** —— app.js 用 MD.render() 填
          #ai-intro-inner，所以里面会出现 <p>/<strong>/<ul> 这些元素。
          排版样式在 style.css 的 .ai-intro-inner（**别再按纯文本给它加
          white-space: pre-wrap**，那会把 <p> 之间的换行也显示出来）。 -->
  <div class="ai-intro" id="ai-intro" hidden>
    <div class="ai-tools">
      <button class="ai-toggle" id="ai-toggle" type="button"
              aria-expanded="false" aria-controls="ai-intro-body">
        <span class="ai-label">AI 摘要与评价</span>
        <svg class="ai-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <!-- 原文链接：只有 source 有值时才出现。rel 里的 noopener noreferrer 别删 ——
           目标是别人的站点（知乎 / 公众号），别把 window.opener 递过去。 -->
      <a class="ai-source" id="post-source" href="#" target="_blank"
         rel="noopener noreferrer" hidden>
        <span>查看原文</span>
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <path d="M15 3h6v6"/>
          <path d="M10 14L21 3"/>
        </svg>
      </a>
      <!-- 分享本文：复制「标题 - 站点名的博客 - 链接」一行。
           和正文底部那个 #btn-share 是同一套行为 —— initShare() 按 data-share 一起绑，
           别在这里再写一份复制逻辑（两处迟早就长歪）。 -->
      <button class="ai-share" id="btn-share-top" type="button" data-share
              aria-label="复制这篇文章的标题和网址">
        <span class="share-text">分享本文</span>
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
          <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
        </svg>
      </button>
    </div>
    <!-- 展开是靠 .ai-intro-body 的 grid-template-rows 从 0fr 过渡到 1fr（见 style.css），
         所以这里不能再挂 hidden —— display:none 会把过渡直接掐掉。
         真正要「藏」的是中间那层 .ai-intro-clip（min-height:0 + overflow:hidden），
         它才是 grid 的那一行。⚠️ padding 必须放在最里面一层 .ai-intro-inner，
         不能放在 clip 上 —— 否则行高 0 时也会被 padding 撑出 30px 的空隙。 -->
    <div class="ai-intro-body" id="ai-intro-body">
      <div class="ai-intro-clip">
        <div class="ai-intro-inner" id="ai-intro-inner"></div>
      </div>
    </div>
  </div>

  <article class="post-body" id="post-body"></article>

  <!-- 标签栏 2026-10-04 撤掉：主人要求文章页不显示标签。
       数据里的 tags 字段**一个字都没动** —— 首页标签栏、筛选、全部文章页的标签云
       都还在用，只是文章页底部不再列出来。 -->

  <!-- 分享：一键把这篇文章的标题和网址复制走。默认藏起来，JS 找到文章后再显示。
       2026-10-04 起顶部按钮行里也有一个（#btn-share-top），两个共用 initShare()。 -->
  <div class="post-share" id="post-share" hidden>
    <button class="share-btn" id="btn-share" type="button" data-share
            aria-label="复制这篇文章的标题和网址">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
        <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
      </svg>
      <span class="share-text">分享本文</span>
    </button>
  </div>

  <nav class="post-nav" id="post-nav"></nav>
</main>
